        if: ${{ always() && steps.select.outputs.slot_16 != '' && steps.module_16_budget.outputs.active == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEXALITH_CICD_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEXALITH_CICD_APP_PRIVATE_KEY }}
          owner: Hexalith
          repositories: ${{ steps.select.outputs.slot_16 }}
          permission-contents: write
          permission-workflows: write
          permission-administration: ${{ steps.select.outputs.check_16 == 'true' && 'read' || '' }}

      - name: Process module slot 16
        if: ${{ always() && steps.select.outputs.slot_16 != '' }}
        continue-on-error: true
        env:
          CICD_TOKEN: ${{ steps.cicd_token.outputs.token }}
          MODULE_TOKEN: ${{ steps.module_16_token.outputs.token }}
        run: python3 -I .delivery-bootstrap/tools/delivery_bootstrap.py module --slot 16

      - name: Check module slot 17 time budget
        id: module_17_budget
        if: ${{ always() && steps.select.outputs.slot_17 != '' }}
        continue-on-error: true
        run: python3 -I .delivery-bootstrap/tools/delivery_bootstrap.py permit --slot 17

      - name: Mint module slot 17 token
        timeout-minutes: 1
        id: module_17_token
        if: ${{ always() && steps.select.outputs.slot_17 != '' && steps.module_17_budget.outputs.active == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEXALITH_CICD_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEXALITH_CICD_APP_PRIVATE_KEY }}
          owner: Hexalith
          repositories: ${{ steps.select.outputs.slot_17 }}
          permission-contents: write
          permission-workflows: write
          permission-administration: ${{ steps.select.outputs.check_17 == 'true' && 'read' || '' }}

      - name: Process module slot 17
        if: ${{ always() && steps.select.outputs.slot_17 != '' }}
        continue-on-error: true
        env:
          CICD_TOKEN: ${{ steps.cicd_token.outputs.token }}
          MODULE_TOKEN: ${{ steps.module_17_token.outputs.token }}
        run: python3 -I .delivery-bootstrap/tools/delivery_bootstrap.py module --slot 17

      - name: Finalize delivery report and aggregate result
        if: ${{ always() }}
        run: python3 -I .delivery-bootstrap/tools/delivery_bootstrap.py finalize

      - name: Upload delivery report
        timeout-minutes: 3
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hexalith-delivery
          path: ${{ env.DELIVERY_DIRECTORY }}/report/delivery.json
          if-no-files-found: error
          retention-days: 90
