name: Delivery

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions: {}
cache-mode: none

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deliver' || format('deliver-validate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.validate.outputs.verdict }}
    steps:
      - name: Checkout CiCd candidate
        id: cicd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup uv
        id: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false

      - name: Checkout Builds objects and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.Builds
          ref: main
          path: references/Hexalith.Builds
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          persist-credentials: false

      - name: Validate candidate and modules
        id: validate
        # A failed Builds checkout must still permit a conservative verdict.
        # Its failed step keeps the job red even if validation can continue.
        # !cancelled(), unlike always(), lets a superseded or cancelled run stop.
        if: ${{ !cancelled() && steps.cicd.outcome == 'success' && steps.uv.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --script tools/validate.py

  deliver:
    needs: validate
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cicd-app
    permissions:
      contents: read
    env:
      DELIVERY_DIRECTORY: ${{ github.workspace }}/.delivery-state-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout immutable delivery bootstrap
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 03d130f82366dec8ed70a21a14177ae55ea09ca1
          path: .delivery-bootstrap
          sparse-checkout: |
            tools/delivery_bootstrap.py
            tools/delivery_runtime.py
          sparse-checkout-cone-mode: false
          submodules: false
          persist-credentials: false

      - name: Select trusted delivery source and initialize report
        id: select
        if: ${{ always() }}
        continue-on-error: true
        env:
          DELIVERY_VERDICT: ${{ needs.validate.outputs.verdict }}
        run: python3 -I .delivery-bootstrap/tools/delivery_bootstrap.py select

      - name: Mint CiCd accepted-ref and freshness token
        timeout-minutes: 1
        id: cicd_token
        if: ${{ always() && steps.select.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEXALITH_CICD_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEXALITH_CICD_APP_PRIVATE_KEY }}
          owner: Hexalith
          repositories: Hexalith.CiCd
          permission-contents: write
          permission-workflows: write
          permission-actions: read

      - name: Initialize delivery and hourly freshness
        if: ${{ always() }}
        continue-on-error: true
        env:
          CICD_TOKEN: ${{ steps.cicd_token.outputs.token }}
        run: python3 -I .delivery-bootstrap/tools/delivery_bootstrap.py initialize

      - name: Check module slot 01 time budget
        id: module_01_budget
        if: ${{ always() && steps.select.outputs.slot_01 != '' }}
        continue-on-error: true
        run: python3 -I .delivery-bootstrap/tools/delivery_bootstrap.py permit --slot 1

      - name: Mint module slot 01 token
        timeout-minutes: 1
        id: module_01_token
        if: ${{ always() && steps.select.outputs.slot_01 != '' && steps.module_01_budget.outputs.active == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEXALITH_CICD_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEXALITH_CICD_APP_PRIVATE_KEY }}
          owner: Hexalith
          repositories: ${{ steps.select.outputs.slot_01 }}
          permission-contents: write
          permission-workflows: write
          permission-administration: ${{ steps.select.outputs.check_01 == 'true' && 'read' || '' }}

      - name: Process module slot 01
        if: ${{ always() && steps.select.outputs.slot_01 != '' }}
        continue-on-error: true
        env:
          CICD_TOKEN: ${{ steps.cicd_token.outputs.token }}
          MODULE_TOKEN: ${{ steps.module_01_token.outputs.token }}
