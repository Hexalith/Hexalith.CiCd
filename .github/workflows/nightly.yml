name: Nightly releases

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions: {}
cache-mode: none

concurrency:
  # Skipped non-main dispatches never join, replace or cancel main's queue.
  group: ${{ github.ref == 'refs/heads/main' && 'nightly' || format('nightly-skipped-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: cicd-app
    permissions:
      contents: read
    env:
      NIGHTLY_DIRECTORY: ${{ github.workspace }}/../.nightly-state-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact_id: ${{ steps.state.outputs.artifact-id }}
    steps:
      - name: Seed conservative state before checkout
        id: seed
        run: >-
          python3 -I -c "import json,os,pathlib; p=pathlib.Path(os.environ['NIGHTLY_DIRECTORY']); p.mkdir(mode=448,parents=True,exist_ok=True); r={'repository': 'Hexalith.Builds', 'workflow': '.github/workflows/builds-release.yml', 'deliveredSha': '', 'dispatchHead': '', 'runId': 0, 'runAttempt': 0, 'link': '', 'eligibility': 'pending', 'dispatch': 'pending', 'status': '', 'conclusion': '', 'outcome': None, 'outcomeError': '', 'publication': 'pending', 'verdict': 'pending', 'reason': 'checkout or initialization did not complete'}; d={'schema':'hexalith.nightly.v1','phase':'dispatch','identity':{'runId':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source':os.environ['GITHUB_SHA']},'registry':[],'builds':{'tag':'','sha':''},'targets':[r],'errors':['checkout or initialization did not complete'],'wait':None,'result':'pending'}; (p/'dispatch.json').write_text(json.dumps(d)+'\n')"

      - name: Checkout CiCd controllers
        id: checkout
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Initialize conservative dispatch state
        id: initialize
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -I tools/nightly.py initialize --phase dispatch
      - name: Record delivery barrier mint boundary
        id: barrier_budget
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -I tools/nightly.py permit --phase dispatch
      - name: Mint barrier_token App token
        id: barrier_token
        if: ${{ !cancelled() && steps.barrier_budget.outputs.active == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEXALITH_CICD_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEXALITH_CICD_APP_PRIVATE_KEY }}
          owner: Hexalith
          repositories: Hexalith.CiCd
          skip-token-revoke: true # zizmor: ignore[github-app] AD-7 forbids aged post-job token use; normal one-hour expiry applies
          permission-actions: read

      - name: Wait for hourly delivery barrier
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CICD_TOKEN: ${{ steps.barrier_token.outputs.token }}
          NIGHTLY_MINT_EPOCH: ${{ steps.barrier_budget.outputs.mint_epoch }}
        run: python3 -I tools/nightly.py barrier --phase dispatch

      - name: Select adopted undrifted targets
        id: select
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -I tools/nightly.py select --phase dispatch
      - name: Record target 01 mint boundary
        id: target_01_budget
        if: ${{ !cancelled() && steps.select.outputs.slot_01 != '' }}
        continue-on-error: true
        run: python3 -I tools/nightly.py permit --phase dispatch --slot 1
      - name: Mint target_01_token App token
        id: target_01_token
        if: ${{ !cancelled() && steps.select.outputs.slot_01 != '' && steps.target_01_budget.outputs.active == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEXALITH_CICD_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEXALITH_CICD_APP_PRIVATE_KEY }}
          owner: Hexalith
          repositories: ${{ steps.select.outputs.slot_01 }}
          skip-token-revoke: true # zizmor: ignore[github-app] AD-7 forbids aged post-job token use; normal one-hour expiry applies
          permission-actions: write
          permission-administration: ${{ steps.select.outputs.slot_01 != 'Hexalith.Builds' && 'read' || '' }}

      - name: Dispatch target slot 01
        if: ${{ !cancelled() && steps.select.outputs.slot_01 != '' }}
        continue-on-error: true
        env:
          TARGET_TOKEN: ${{ steps.target_01_token.outputs.token }}
          NIGHTLY_MINT_EPOCH: ${{ steps.target_01_budget.outputs.mint_epoch }}
