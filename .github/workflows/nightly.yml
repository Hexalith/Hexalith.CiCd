        if: ${{ !cancelled() && steps.initialize.outputs.slot_18 != '' && steps.target_18_budget.outputs.active == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HEXALITH_CICD_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEXALITH_CICD_APP_PRIVATE_KEY }}
          owner: Hexalith
          repositories: ${{ steps.initialize.outputs.slot_18 }}
          skip-token-revoke: true # zizmor: ignore[github-app] AD-7 forbids aged post-job token use; normal one-hour expiry applies
          permission-contents: write
          permission-workflows: write
          permission-actions: read

      - name: Publish target slot 18
        if: ${{ !cancelled() && steps.initialize.outputs.slot_18 != '' }}
        continue-on-error: true
        env:
          TARGET_TOKEN: ${{ steps.target_18_token.outputs.token }}
          NIGHTLY_MINT_EPOCH: ${{ steps.target_18_budget.outputs.mint_epoch }}
        run: python3 -I tools/nightly.py publish --phase publish-ready --slot 18
      - name: Finalize publish-ready state and verdicts
        if: ${{ always() }}
        env:
          NIGHTLY_CANCELLED: ${{ job.status == 'cancelled' }}
        run: python3 -I tools/nightly.py finalize --phase publish-ready

      - name: Report unavailable checkout
        if: ${{ always() && steps.checkout.outcome != 'success' }}
        run: >-
          python3 -I -c "import os,pathlib; p=os.environ.get('GITHUB_STEP_SUMMARY'); pathlib.Path(p).open('a').write('Nightly releases: FAIL — controller checkout unavailable; persisted seed records the orchestration failure.\n') if p else None; raise SystemExit(1)"

      - name: Upload token-free publish-ready state
        id: state
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hexalith-nightly-nightly-${{ github.run_attempt }}
          path: ${{ env.NIGHTLY_DIRECTORY }}/nightly.json
          if-no-files-found: error
          retention-days: 90
