name: Evidence

on:
  push:
    branches: [main]
  pull_request:

permissions: {}
cache-mode: none

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout evidence checker at the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          sparse-checkout: /tools/check_evidence.py
          sparse-checkout-cone-mode: false
          submodules: false
          persist-credentials: false

      - name: Check committed evidence changes
        env:
          EVIDENCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 -I tools/check_evidence.py
