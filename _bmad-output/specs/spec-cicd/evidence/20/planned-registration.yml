# Staged handoff only. Register after an acceptable compatible Builds release and live-main product actions.
solution: Hexalith.EventStore.slnx
ciTimeoutMinutes: 180
additionalSdkVersion: 10.0.404
dapr: true
browsers: true
registry: false
codeql:
- csharp
- python
tests:
  integration: []
  exclude:
    tests/Hexalith.EventStore.PayloadProtection.Tests/Hexalith.EventStore.PayloadProtection.Tests.csproj: after-unit-tests
    ? tests/Hexalith.EventStore.PayloadProtection.AzureKeyVault.LiveTests/Hexalith.EventStore.PayloadProtection.AzureKeyVault.LiveTests.csproj
    : payload-azure
    ? tests/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests.csproj
    : after-integration-tests
    tests/Hexalith.EventStore.Server.LiveSidecar.Tests/Hexalith.EventStore.Server.LiveSidecar.Tests.csproj: after-integration-tests
    tests/Hexalith.EventStore.PublishedCompatibility.Tests/Hexalith.EventStore.PublishedCompatibility.Tests.csproj: after-integration-tests
hooks:
- after-unit-tests
- after-integration-tests
- nightly
jobs:
  payload-azure:
    trigger: manual
    runner:
      group: payload-protection-azure-private-ephemeral
      labels:
      - self-hosted
      - linux
      - x64
    environment: payload-protection-azure-conformance
    secrets:
    - PAYLOAD_AZURE_AUTHORITY_JSON
    - PAYLOAD_AZURE_CUSTODY_JSON
    preparation: build-only
    timeoutMinutes: 45
submodules:
- references/Hexalith.Tenants
- references/Hexalith.Platform
- references/Hexalith.FrontComposer
