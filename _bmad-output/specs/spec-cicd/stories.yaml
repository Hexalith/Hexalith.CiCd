    and pushes one build(cicd) commit with an App token when there is a diff,
    on push, hourly at minute 47, and by hand (CAP-4, CAP-6, CAP-8; AD-6,
    AD-7). Runs on main are never cancelled, each run uploads delivery.json, a
    skipped module keeps its previous ref and is reported, and the 26-hour
    nightly freshness check applies only once nightly.yml has run.
  spec_checkpoint: true
  invoke_dev_with: >-
