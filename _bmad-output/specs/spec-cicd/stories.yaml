- id: "11"
  title: "Pilot migration: Commons and PolymorphicSerializations"
  description: >-
    Adopt both repos through the AD-21 sequence and apply the gate rule
    (CAP-10, CAP-16). The pause after this story is for watching one real
    nightly run, scheduled or dispatched (CAP-13): the pilots' CodeQL and
    releases, the Builds bump, and delivery. At this existing pilot
    checkpoint, confirm 10-1's branch findings and test its deferred Update
