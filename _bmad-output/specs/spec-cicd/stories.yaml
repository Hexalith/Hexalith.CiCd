- id: "10-1"
  title: "Module-agent token"
  description: >-
    Qualify the supplied AD-7 module-agent token with three pre-adoption checks:
    workflow-changing push refusal and workflow-dispatch refusal (CAP-7),
    and product-only branch push from current main. Meaningful PR Update
    branch is deferred to story 11 by the human's 2026-11-15 decision after
    GitHub refused its historical-head fixture. Use existing real history on
    a declared module; prior delivery is not required. Record the verified
    findings separately from actual delivery proof. Story 11 subsequently
    qualified both post-delivery fresh-main pushes and both meaningful Update
    branch operations: GitHub allowed the latter to import owned workflows.
    10-2's qualified instruction forbids importing owned CI/CD changes through
    that operation and directs product-only reapplication from current main.
    The pilot probe PRs/refs are cleaned up without merging.
  invoke_dev_with: >-
    Use the dedicated token from the protected credential file
    /home/administrator/.config/gh-module-agent/token, not a gh profile;
    preserve the default CiCd-agent authentication. Commons is a candidate
    declared module. Exercise real GitHub operations using existing history,
    changing no owned file or module main ref, manufacturing no delivery and
    adopting no module for this qualification. Use disposable refs/PRs, do not
    merge, and clean up. Report exact revisions, responses and evidence limits;
    leave actual post-CiCd-delivery confirmation to story 11's checkpoint.
