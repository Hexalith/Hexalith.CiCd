  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. The library
    reads paths from git and writes only to the index (AD-4). The release is
    dispatched from an interactive CiCd session (CAP-15).
- id: "4-2"
  title: "Setup files and the render"
  description: >-
