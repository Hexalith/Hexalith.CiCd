- id: "1"
  title: "Maintainer preconditions and remaining checks"
  description: >-
    Meet the one-time org settings and the CiCd and Builds preconditions
    (AD-7, AD-19, AD-21): the App and this repo's cicd-app environment,
    rulesets on main, v* tags and delivered/**, the agent-App installation
    scope, the CiCd-agent token that stories 2 to 9 run under, the HEXALITH_*
    org secrets and variables with a pull-only Zot account, restricted legacy
    org secrets, 90-day retention, push protection, and Builds' nuget.org
    policy for builds-release.yml with environment production, scoped to
    Hexalith.Builds*. Check whether a package-mode build reads any submodule
    besides Builds, and whether a ruleset can restrict v* tag creation to
    GitHub Actions and the App, and record both answers in the spec.
  done_checkpoint: true
  invoke_dev_with: >-
    Draft the checklist and verify through the API what the App's permissions
    allow; the maintainer creates the App and changes org and repository
    settings. CiCd and Builds keep exactly the org owners as collaborators, no
    deploy keys, and no write installation except the App. Keep Builds' NuGet
    publishing working across the rename in story 2-1. From story 2-1 on,
    agent sessions use the CiCd-agent token, never the maintainer's personal
    gh login.
- id: "2-1"
  title: "Rename Builds' own workflows"
  description: >-
    Rename Builds' own ci.yml and build-release.yml to builds-ci.yml and
    builds-release.yml (AD-19, AD-20): repoint their hard-coded identities,
    including the green-CI check, delete the tests that assert their text and
    repoint the rest, drop the dependency-review call, delete
    eventstore-maintenance-publisher.yml, and exclude the frozen paths from
    Builds' dependabot.yml. Builds' CI stays green and its NuGet publishing
    keeps working through story 1's policy on builds-release.yml (CAP-15).
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Frozen files
    stay unchanged except tests (AD-20), including the composites modules call
    directly: initialize-dotnet, initialize-build, create-release, and verify.
- id: "2-2"
  title: "Builds' own quality checks"
  description: >-
    Make builds-ci.yml run actionlint and zizmor with their committed configs
    and the ignores in the spine's Action references convention, the Python
    tests on 3.12 and on the runner's python3, and the public-API check
    against the last release tag (CAP-15; AD-10, AD-11). No Builds test
    asserts workflow text.
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Frozen files
    stay unchanged except tests (AD-20), including the composites modules call
    directly: initialize-dotnet, initialize-build, create-release, and verify.
- id: "2-3"
  title: "CI config contract"
  description: >-
    Add schemas/hexalith.ci.v1.json with every knob and its default, its
    stdlib loader in Github/lib/, and Builds' own hand-written
    hexalith-ci.json without buildsTag, with builds-ci.yml running the loader
    and the schema over the same valid and invalid fixtures (CAP-1; AD-1,
    AD-3, AD-4, AD-19).
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Frozen files
    stay unchanged except tests (AD-20), including the composites modules call
    directly: initialize-dotnet, initialize-build, create-release, and verify.
    Add the submodules knob if story 1 found a package-mode build that reads
    more submodules (spine Deferred).
- id: "2-4"
  title: "Fail-fast CI: build and unit tests"
  description: >-
    Write the reusable ci.yml through stage 3: a Release package-mode build
    without audit, then the shared test classifier and unit tests project by
    project, stopping at the first failing project, run by builds-ci.yml
    against Builds itself (CAP-1, CAP-2; AD-9, AD-12, AD-13). The classifier
    and build flags are scripts that check.py (story 6) reuses.
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Frozen files
    stay unchanged except tests (AD-20), including the composites modules call
    directly: initialize-dotnet, initialize-build, create-release, and verify.
    Verify $/ first and apply the AD-9 fallback if it fails (spine Deferred).
    Stage 1, the guard, arrives in 5-1; keep its slot first in the job.
- id: "2-5"
  title: "Stage 4: environment setup and hook points"
  description: >-
    Add the one environment-setup composite (Dapr at the Builds Props/ pins,
    bumped to 1.19.1; browsers; the registry pull login; each as enabled),
    then the after-unit-tests hook, integration tests project by project, and
    the after-integration-tests hook, so an enabled hook reuses the job's
    build and environment (CAP-2, CAP-5; AD-12, AD-14). Linux prepare (2-6)
    reuses this composite.
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Frozen files
    stay unchanged except tests (AD-20), including the composites modules call
    directly: initialize-dotnet, initialize-build, create-release, and verify.
- id: "2-6"
  title: "Sample module self-test and the Windows job"
  description: >-
    Add Samples/Hexalith.Sample/, importing Builds through the module MSBuild
    files, with its hook and job actions in Builds' root .github/actions/; a
    second builds-ci.yml call of the reusable ci.yml with the test-only
    module-root input; the ci.yml outputs that Windows prepare uses; the
    prepare composite; and one Windows job shaped like a rendered one (CAP-5,
    CAP-15; AD-12, AD-19). A Builds change that breaks the sample's CI fails
    Builds' CI.
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Frozen files
    stay unchanged except tests (AD-20), including the composites modules call
    directly: initialize-dotnet, initialize-build, create-release, and verify.
- id: "3-1"
  title: "Spike: OCI containers and NuGet/login in the publish composite"
  description: >-
    Prove that containers built once as OCI archives can be pushed from a
    remote publish composite and that NuGet/login works inside it, or apply
    the spine's Deferred fallback (NuGet/login in the caller's publish job,
    its key passed as a composite input), and decide whether publish adds
    build provenance (AD-17, spine Deferred). Record the answers so the spine
    and the spec are updated before 3-2 builds on them.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there.
- id: "3-2"
  title: "Release gate jobs and the outcome"
  description: >-
    Write the reusable release.yml's resolve job (release SHA and mode, kill
    switch, green CI), the codeql matrix and nightly-hook jobs at github.sha,
    the release-outcome schema and the final outcome job, so a red main fails
    with "main is red, nothing released", a false kill switch ends "publishing
    disabled", and an open high or critical alert blocks the release (CAP-12,
    CAP-14; AD-16, AD-17, AD-18). The drift check joins resolve in 5-1.
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. resolve runs
    stdlib only with contents: write and actions: read (AD-16, AD-17).
    nightly-hook uses 2-6's prepare.
- id: "3-3"
  title: "Create mode: version, audited build, marked draft"
  description: >-
    Add the version job (commit-analyzer and release-notes-generator under the
    module and Builds release rules), the build that packs once with the audit
    gate and uploads the release artifact, and the draft job that creates the
    marked draft only after the artifact, or refuses when main's workflows
    changed during the run (CAP-12, CAP-14; AD-16, AD-17). No releasable
    commit ends "nothing to release", and a vulnerable package or an audit
    that can't run blocks the release.
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. The draft
    carries the five hexalith-release trailers and accepts only a one-step
    version increment (AD-17).
- id: "3-4"
  title: "The publish composite"
  description: >-
    Write the publish composite: it checks the artifact, logs in with
    NuGet/login, pushes the packages with --skip-duplicate and the containers
    by version tag, then publishes the draft with the tag created last, or
    ends ready when GITHUB_TOKEN can't publish it, and writes the outcome
    (CAP-12, CAP-13; AD-17). It follows 3-1's answers on containers, login and
    provenance.
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. publish refuses
    a v<version> tag that points elsewhere (AD-17).
- id: "3-5"
  title: "Complete mode: reruns finish from the original artifact"
  description: >-
    Make a rerun complete a marked draft from the release artifact of the run
    that created it, without rebuilding or re-checking, and delete a stale
    draft whose artifact is gone only when none of its packages or images was
    published (CAP-12; AD-16, AD-17). A version is never republished from
    different content.
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there.
- id: "3-6"
  title: "Rewrite builds-release.yml onto the shared release"
  description: >-
    Rewrite builds-release.yml to call the reusable release with ci-workflow
    builds-ci.yml and release-rules builds, its publish job in
    hexalith-release via $/Github/publish (CAP-15; AD-19). The same change
    removes the G-4/G-6 jobs and tests, the build-and-test aggregator and the
    codeql.yml call from builds-ci.yml, and classifies the Props/ catalog
    validators (AD-11, AD-20, gate-classification.md).
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. The maintainer
    switches Builds' nuget.org policy from environment production to
    hexalith-release in the same window (AD-19).
- id: "3-7"
  title: "Bootstrap the first Builds release"
  description: >-
    Re-check AD-19's release preconditions right before the dispatch (no
