- id: "1"
  title: "Maintainer preconditions and remaining checks"
  description: >-
    Create the org GitHub App with the AD-7 permissions, install it on Builds
    and this repo, store its key and ID here, and meet Builds' preconditions
    (AD-19) and this repo's (AD-21: delivered branch, ruleset), including a
    nuget.org policy for builds-release.yml. Check whether a package-mode build
    reads any submodule besides Builds, and record the answer in the spec.
  done_checkpoint: true
  invoke_dev_with: >-
    Draft the checklist and verify through the API what the App's permissions
    allow; the maintainer creates the App and changes repository settings.
    Keep Builds' NuGet publishing working across the rename in story 2.
- id: "2"
  title: "Minimal reusable CI workflow in Builds"
  description: >-
    First replace Builds' own ci.yml and build-release.yml with builds-ci.yml
    and a minimally adapted builds-release.yml that checks builds-ci.yml for
    green CI (AD-20), then write the reusable ci.yml, the hexalith-ci.json
    schema, the test classifier, environment setup, the hook points, and the
    prepare composite (CAP-1, CAP-2, CAP-5; AD-12 to AD-14). builds-ci.yml
    lints with actionlint and zizmor and runs the reusable CI against Builds
    and Samples/ (CAP-15).
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there.
- id: "3"
  title: "Reusable release workflow in Builds, with nightly CodeQL"
  description: >-
    Write the reusable release.yml with its codeql and nightly-hook jobs, the
    draft-release state machine, the audit gate, and the publish composite,
    and rewrite builds-release.yml onto it (CAP-12, CAP-14, CAP-15; AD-16,
    AD-17, AD-19). Run the two Deferred spikes (publishing a draft behind main;
    OCI containers and NuGet/login in the remote composite), then dispatch the
    first Builds release by hand to seed builds-version.
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there.
- id: "4"
  title: "Setup files, rendering, and the perimeter"
  description: >-
    Write the setup-file handling, templates, and render.py in this repo,
    rendering every owned file and each rendered/<Repo>.perimeter.json, plus
    the perimeter schema and library in Builds that guard, restore, and
    delivery share (CAP-4; AD-3 to AD-5). Add deliver.yml with its validate
    job only: the global checks and the per-module checks.
  spec_checkpoint: true
  invoke_dev_with: >-
    Perimeter schema and library in references/Hexalith.Builds; setup/,
    templates/, rendered/, tools/, and deliver.yml's validate job in this
    repo. Ship the library in a Builds release before story 7 uses it.
- id: "5"
  title: "Guard and restore in Builds"
  description: >-
    Build the guard as stage 1 of the shared CI: it reads the delivered
    branch, checks the perimeter, enabled actions, the custom-action deny
    list, NU1903/NU1904 waivers, and commitlint, and fails with the ownership
    message (CAP-8, CAP-9, CAP-14; AD-8). Add the restore job, which repairs
    main and dispatches CI, and the release's drift check (AD-17 step 1).
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Use story 4's
    perimeter library; Builds' self-test uses a fixture perimeter in Samples/
    (AD-19).
- id: "6"
  title: "Local check command"
  description: >-
    Provide check.py in Builds: it checks that the Builds pointer equals
    builds_tag, then runs the same guard, build flags, and classified unit
    tests as CI stages 1–3 (CAP-3; AD-15). No pre-push hook.
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there.
- id: "7"
  title: "Delivery: the single write path into modules"
  description: >-
    Add the deliver job to deliver.yml: after validation, advance the
    delivered branch, apply each module's perimeter with Builds' library, and
    push one build(cicd) commit with an App token when there is a diff, on
    push, hourly at minute 47, and by hand (CAP-4, CAP-6, CAP-8; AD-6, AD-7).
    A module that fails its own checks is skipped and reported while the
    others are delivered.
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in this repo. The App key stays a secret here and never enters a
    module, Builds, or an agent session.
- id: "8"
  title: "Nightly release scheduler"
  description: >-
    Add nightly.yml: at 02:17 UTC it dispatches builds-release.yml and every
    adopted module's release.yml at once, waits, summarizes the outcomes, then
    bumps builds-version and waits for that delivery (CAP-6, CAP-13, CAP-15;
    AD-18). Include the keepalive and the enable-API calls, and verify whether
    bot commits count as activity for the 60-day schedule disable.
  spec_checkpoint: true
- id: "9"
  title: "Nightly cross-module duplicate scan"
  description: >-
    Add the scan to nightly.yml: it reads each module's live main and fails,
    naming the code, when a fragment appears in the custom actions or called
    scripts of two or more modules, without blocking the bump (CAP-9,
    enforcement.md). Tune the threshold, including the early noise from
    Memories' and Tenants' Python tooling.
- id: "10"
  title: "Agent guardrails"
  description: >-
    Write the CI/CD-ownership block text in this repo's templates, make
    AI.Tools' shared guide link to it and drop the release-on-merge line, and
    set up the module-agent and CiCd-agent tokens with the AD-7 permissions
    (CAP-7, CAP-11). Add the gate rule to this repo's AGENTS.md
    (gate-classification.md).
  invoke_dev_with: >-
    AI.Tools' guide: module-agent token. Templates and AGENTS.md: this repo.
- id: "11"
  title: "Pilot migration: Commons and PolymorphicSerializations"
  description: >-
    Adopt both repos through the AD-21 sequence and apply the gate rule
    (CAP-10, CAP-16). The pause after this story is for watching one real
    night: CodeQL, release, Builds bump, and delivery.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Check the AD-21 maintainer preconditions first. Product-side changes
    (custom actions, gate-rule deletions, removing module NuGet audit waivers)
    go in references/Hexalith.Commons and
    references/Hexalith.PolymorphicSerializations with the module-agent token;
    never edit owned files there. Waivers move into Builds' Props/. Then
    commit submodule + setup file + render here; delivery adopts the module.
