  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Delete
    commitlint-caller.yml only after story 1's ruleset cut.
- id: "5-3"
  title: "Restore job"
  description: >-
    Add the restore job: on a push to main with drift it recomputes the
