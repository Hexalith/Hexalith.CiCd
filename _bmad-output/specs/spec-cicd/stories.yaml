    through expected-source (CAP-8; AD-4, AD-8, AD-19). Add the same
    comparison to the release's resolve job as the drift check against
    delivered-sha (AD-17).
  spec_checkpoint: true
  invoke_dev_with: >-
    Work in references/Hexalith.Builds; commit and push there. Use 4-1's
    perimeter library and loader; Builds' self-test uses the fixture tree in
    Samples/Hexalith.Sample/ (AD-19).
- id: "5-2"
  title: "Guard lints and commitlint"
  description: >-
    Add the guard's custom-action lint (composite only, uses: limited to
