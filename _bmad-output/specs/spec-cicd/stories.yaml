  spec_checkpoint: true
  invoke_dev_with: >-
    The dispatch comes from an interactive CiCd session; builds-version is
    committed in this repo. If the bootstrap run ends ready, the maintainer
    publishes its draft by hand after publish-ready's checks (AD-19).
