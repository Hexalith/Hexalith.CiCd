name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: "Hexalith/Hexalith.Builds/.github/workflows/ci.yml@v6.7.0"
    permissions: {"actions": "write", "contents": "write"}
    with:
      job-timeout-minutes: 360
    secrets:
      registry-pull-username: ${{ secrets.HEXALITH_REGISTRY_PULL_USERNAME }}
      registry-pull-password: ${{ secrets.HEXALITH_REGISTRY_PULL_PASSWORD }}
  "windows-macos-product":
    needs:
    - ci
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
    - uses: Hexalith/Hexalith.Builds/Github/prepare@v6.7.0
      with:
        global-json: ${{ needs.ci.outputs.global-json }}
        module-authority: ${{ needs.ci.outputs.module-authority }}
        module-manifest: ${{ needs.ci.outputs.module-manifest }}
        solution: ${{ needs.ci.outputs.solution }}
        source-revision: ${{ needs.ci.outputs.source-revision }}
        submodules: ${{ needs.ci.outputs.submodules }}
        windows-checkout: ${{ needs.ci.outputs.windows-checkout }}
    - env:
        HEXALITH_JOB_NAME: macos-product
        HEXALITH_JOB_NEEDS: ${{ toJSON(needs) }}
        HEXALITH_JOB_PARAMETERS: '{}'
        HEXALITH_QUALIFICATION_PARAMETERS: '{}'
      uses: ./.github/actions/macos-product
    timeout-minutes: 60
  "windows-windows-product":
    needs:
    - ci
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
    - uses: Hexalith/Hexalith.Builds/Github/prepare@v6.7.0
      with:
        global-json: ${{ needs.ci.outputs.global-json }}
        module-authority: ${{ needs.ci.outputs.module-authority }}
        module-manifest: ${{ needs.ci.outputs.module-manifest }}
        solution: ${{ needs.ci.outputs.solution }}
        source-revision: ${{ needs.ci.outputs.source-revision }}
        submodules: ${{ needs.ci.outputs.submodules }}
        windows-checkout: ${{ needs.ci.outputs.windows-checkout }}
    - env:
        HEXALITH_JOB_NAME: windows-product
        HEXALITH_JOB_NEEDS: ${{ toJSON(needs) }}
        HEXALITH_JOB_PARAMETERS: '{}'
        HEXALITH_QUALIFICATION_PARAMETERS: '{}'
      uses: ./.github/actions/windows-product
    timeout-minutes: 60
